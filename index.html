<body class="bg-[#0a0b0c] text-white">
  <!-- Dioxus Mount Point -->
  <div id="main">
    <!-- Beautiful static loading screen styled to match dark mode and Tailwind theme -->
    <div id="loading-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #0a0b0c; color: white; font-family: 'Space Grotesk', sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
        <!-- Spinner -->
        <div style="position: relative; width: 3.5rem; height: 3.5rem;">
          <div style="position: absolute; inset: 0; border-radius: 9999px; border-width: 4px; border-style: solid; border-color: rgba(0, 191, 255, 0.15);"></div>
          <div style="position: absolute; inset: 0; border-radius: 9999px; border-width: 4px; border-style: solid; border-color: transparent; border-top-color: #00bfff; animation: spin 1s linear infinite;"></div>
        </div>
        
        <!-- Text -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0.35rem;">
          <h1 style="font-size: 1.75rem; font-weight: 700; letter-spacing: 0.1em; color: #00bfff; margin: 0; text-transform: uppercase;">RusTerm</h1>
          <p style="font-size: 0.8rem; color: #4b5563; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; margin: 0; letter-spacing: 0.02em;">Loading WebAssembly Application...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Fallback & SEO content for crawlers / non-JS environments -->
  <noscript>
    <div style="max-width: 800px; margin: 2rem auto; padding: 1.5rem; background-color: #111418; border: 1px solid #1f2937; border-radius: 8px; font-family: sans-serif; line-height: 1.6;">
      <h1 style="color: #00bfff; font-size: 1.5rem; margin-bottom: 0.5rem;">RusTerm - High Performance Web Serial Monitor & Terminal</h1>
      <p style="color: #d1d5db;">RusTerm is an open-source, high-performance serial monitor and terminal running natively in your browser using Rust and WebAssembly. No drivers or software installation required.</p>
      <ul style="color: #9ca3af; margin: 1rem 0; padding-left: 1.5rem;">
        <li><strong>Web Serial API:</strong> Direct hardware serial communication over USB-CDC and COM ports.</li>
        <li><strong>Gigabyte-Scale Logging:</strong> OPFS (Origin Private File System) backing with zero UI latency.</li>
        <li><strong>VT100 / ANSI Terminal:</strong> Full interactive xterm.js terminal with color and cursor escape sequences.</li>
        <li><strong>Real-Time Filtering:</strong> Progressive search and regex filtering without UI blocking.</li>
      </ul>
      <p style="color: #e5e7eb;">To use RusTerm, please enable JavaScript and open this page in a browser that supports the Web Serial API (Google Chrome, Microsoft Edge, Opera).</p>
    </div>
  </noscript>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</body>
